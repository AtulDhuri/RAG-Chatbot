<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatOS Leads</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.panel{background:white;border:1px solid #e4e9f2;border-radius:12px;padding:18px;overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px 9px;border-bottom:1px solid #edf0f5;text-align:left;vertical-align:top}.table th{color:#64748b;font-size:12px;white-space:nowrap}.button{border:0;border-radius:8px;background:#2563eb;color:#fff;padding:10px 15px;cursor:pointer}.muted{color:#718096}.detail{white-space:pre-wrap;line-height:1.6}</style></head><body><div class="top"><div><h1>Leads</h1><div class="muted">Visitor interest captured from ChatOS conversations</div></div><button class="button" onclick="load()">Refresh</button></div><div class="panel"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Interested In</th><th>Lead Summary</th><th>Date</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div><script>const token=sessionStorage.getItem('adminToken');function esc(v){return String(v||'').replace(/[&<>\"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[x]))}async function load(){if(!token){location.href='/admin';return}let r=await fetch('/api/admin/leads',{headers:{Authorization:'Bearer '+token}});if(r.status===401){location.href='/admin';return}let d=await r.json();document.querySelector('#rows').innerHTML=(d.items||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.phone)}</td><td>${esc(x.interested_in)}</td><td>${esc(x.lead_summary)}</td><td>${esc(x.created_at)}</td><td><button class="button" onclick="detail('${encodeURIComponent(x.id)}')">View</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No leads yet.</td></tr>'}async function detail(id){let x=await(await fetch('/api/admin/leads/'+decodeURIComponent(id),{headers:{Authorization:'Bearer '+token}})).json();showDetail(`Name: ${x.name}\nEmail: ${x.email}\nPhone: ${x.phone}\nInterested In: ${x.interested_in}\n\nSummary: ${x.lead_summary}\n\nConversation ID: ${x.conversation_id||'Not supplied'}`)}function showDetail(text){let box=document.getElementById('detailBox');if(!box){box=document.createElement('div');box.id='detailBox';box.style='position:fixed;inset:10%;background:white;border:1px solid #d6deea;border-radius:12px;padding:24px;z-index:30;white-space:pre-wrap;overflow:auto;box-shadow:0 20px 60px #02061755';document.body.appendChild(box)}box.textContent=text+'\n\n[Click to close]';box.onclick=()=>box.remove()}load()</script></body></html>
