<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login</title><style>body{font-family:system-ui,sans-serif;background:#111827;color:#111827;padding:32px}.card{max-width:420px;margin:auto;background:#fff;padding:24px;border-radius:14px}input,button{font:inherit;width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border-radius:8px}input{border:1px solid #d1d5db}button{border:0;background:#111827;color:#fff;cursor:pointer}.secondary{background:#6b7280}.error{color:#b91c1c;min-height:24px}</style></head>
<body><section class="card"><h1>Administrator access</h1><p>Choose a plan before creating your account.</p><p><a href="/pricing">View available plans</a></p><p id="status" class="error"></p><form id="login"><input id="email" type="email" placeholder="Administrator email" required><input id="password" type="password" placeholder="Password" minlength="10" required><input id="admin-code" type="password" placeholder="Administrator registration code (for new account)"><button>Log in as administrator</button></form><button class="secondary" id="register" type="button">Create admin account</button></section>
<script>(function(){function request(path,body){return fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||'Request failed');return d;});});}function verify(){return fetch('/api/admin/me',{credentials:'same-origin'}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||'This email is not an administrator');return d;});}).then(function(){location.href='/admin';});}var e=document.getElementById('email'),p=document.getElementById('password'),s=document.getElementById('status');document.getElementById('login').onsubmit=function(x){x.preventDefault();request('/api/auth/login',{email:e.value.trim(),password:p.value}).then(verify).catch(function(x){s.textContent=x.message;});};document.getElementById('register').onclick=function(){request('/api/auth/register',{email:e.value.trim(),password:p.value,role:'admin',admin_code:document.getElementById('admin-code').value}).then(verify).catch(function(x){s.textContent=x.message;});};})();</script></body></html>
