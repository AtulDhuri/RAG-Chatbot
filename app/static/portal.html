<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatOS Customer Portal</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{display:flex;min-height:100vh}.side{width:235px;background:#101827;color:#dbe4f0;padding:24px 16px}.brand{font-weight:800;color:white;font-size:19px;margin:0 10px 30px}.nav{display:block;width:100%;border:0;background:transparent;color:#aab8cb;text-align:left;padding:12px 10px;border-radius:8px;font-size:14px;cursor:pointer}.nav:hover,.nav.active{background:#20304a;color:#fff}.main{flex:1;padding:30px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:27px}.muted{color:#718096;font-size:13px}.button{border:0;border-radius:8px;background:#2563eb;color:white;padding:10px 15px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid #e4e9f2;border-radius:12px;padding:18px;box-shadow:0 3px 12px #1d35570b}.metric{font-size:28px;font-weight:800;margin-top:9px}.label{color:#718096;font-size:13px}.panel{margin-bottom:18px}.panel h2{font-size:17px;margin:0 0 15px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px 8px;text-align:left;border-bottom:1px solid #edf0f5}.table th{font-size:12px;color:#64748b}.login{max-width:380px;margin:15vh auto}.login input{display:block;width:100%;padding:12px;border:1px solid #d6deea;border-radius:8px;margin:10px 0}.error{color:#b91c1c;font-size:13px;margin-top:10px}@media(max-width:850px){.side{width:72px}.brand{font-size:0}.brand:after{content:'CO';font-size:19px}.nav{font-size:0}.nav:before{content:'•';font-size:22px}.grid{grid-template-columns:repeat(2,1fr)}.main{padding:16px}}</style></head><body><div id="login" class="login card"><h1>Customer Portal</h1><p class="muted">Use the client ID and password provided by ChatOS.</p><input id="client" placeholder="Client ID"><input id="password" type="password" placeholder="Password"><button class="button" onclick="login()">Sign in</button><div id="error" class="error"></div></div><div id="app" class="shell" style="display:none"><aside class="side"><div class="brand">ChatOS Portal</div><button class="nav active" onclick="show('Dashboard',this)">Dashboard</button><button class="nav" onclick="show('Conversations',this)">Conversations</button><button class="nav" onclick="show('Most Asked Questions',this)">Most Asked Questions</button><button class="nav" onclick="show('Unanswered Questions',this)">Unanswered Questions</button><button class="nav" onclick="show('Topics & Trends',this)">Topics &amp; Trends</button><button class="nav" onclick="show('Leads',this)">Leads</button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Understand visitor demand and ChatOS value</div></div><button class="button" onclick="logout()">Sign out</button></div><div id="content"></div></main></div><script>let token=sessionStorage.getItem('portalToken');const $=id=>document.getElementById(id);function esc(v){return String(v||'').replace(/[&<>\"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[x]))}async function request(path){let r=await fetch('/api/portal'+path,{headers:{Authorization:'Bearer '+token}});if(r.status===401){logout();throw Error('auth')}return r.json()}async function login(){let r=await fetch('/api/portal/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_id:$('client').value,password:$('password').value})});let d=await r.json();if(!r.ok){$('error').textContent=d.detail||'Invalid credentials';return}token=d.token;sessionStorage.setItem('portalToken',token);start()}function logout(){sessionStorage.removeItem('portalToken');location.reload()}function start(){$('login').style.display='none';$('app').style.display='flex';loadDashboard()}async function loadDashboard(){let d=await request('/dashboard');$('content').innerHTML=`<div class="grid"><div class="card"><div class="label">Total Conversations</div><div class="metric">${d.total_conversations}</div></div><div class="card"><div class="label">Total Leads</div><div class="metric">${d.total_leads}</div></div><div class="card"><div class="label">Lead Conversion</div><div class="metric">${d.lead_conversion_percent}%</div></div><div class="card"><div class="label">Unanswered Questions</div><div class="metric">${d.unanswered_questions}</div></div></div><div class="panel"><h2>Recent Leads</h2><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Interested In</th><th>Summary</th><th>Date</th></tr></thead><tbody>${(d.recent_leads||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.interested_in)}</td><td>${esc(x.lead_summary)}</td><td>${esc(x.created_at)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No leads yet.</td></tr>'}</tbody></table></div><div class="panel"><h2>Top Topics</h2>${(d.top_topics||[]).map(x=>`<p>${esc(x.topic)} <b>${x.count}</b></p>`).join('')||'<p class="muted">Analytics will appear as visitors chat.</p>'}</div>`}async function show(name,button){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));button.classList.add('active');$('title').textContent=name;if(name==='Dashboard')return loadDashboard();let path=name==='Conversations'?'/conversations':name==='Most Asked Questions'?'/questions/most-asked':name==='Unanswered Questions'?'/questions/unanswered':name==='Topics & Trends'?'/topics':'/leads';let d=await request(path);let items=d.items||[];$('content').innerHTML=`<div class="panel"><h2>${esc(name)}</h2><table class="table"><tbody>${items.map(x=>`<tr><td>${esc(x.group_name||x.question||x.topic||x.name||x.email||'')}</td><td>${esc(x.representative_question||x.suggested_action||x.count||x.interested_in||x.lead_summary||'')}</td><td>${esc(x.frequency||x.created_at||'')}</td></tr>`).join('')||'<tr><td class="muted">No data yet.</td></tr>'}</tbody></table></div>`}if(token)start()</script></body></html>
