<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatOS Client Dashboard</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{display:flex;min-height:100vh}.side{width:238px;background:#101827;color:#dbe4f0;padding:24px 16px}.brand{font-weight:800;color:#fff;font-size:19px;margin:0 10px 30px}.nav{display:block;width:100%;border:0;background:transparent;color:#aab8cb;text-align:left;padding:12px 10px;border-radius:8px;font-size:14px;cursor:pointer;margin:2px 0}.nav:hover,.nav.active{background:#20304a;color:#fff}.main{flex:1;padding:30px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.top h1{margin:0;font-size:27px}.muted{color:#718096;font-size:13px}.button{border:0;border-radius:8px;background:#2563eb;color:#fff;padding:10px 15px;cursor:pointer}.button.secondary{background:#e8eef8;color:#1e3a5f}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.toolbar select,.toolbar input{padding:9px 10px;border:1px solid #d6deea;border-radius:8px;background:#fff;color:#172033}.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid #e4e9f2;border-radius:12px;padding:18px;box-shadow:0 3px 12px #1d35570b}.metric{font-size:28px;font-weight:800;margin-top:8px}.label{color:#718096;font-size:13px}.trend{font-size:12px;margin-top:6px;color:#64748b}.up{color:#15803d}.down{color:#b91c1c}.panel{margin-bottom:18px}.panel h2{font-size:17px;margin:0 0 15px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px 8px;text-align:left;border-bottom:1px solid #edf0f5;vertical-align:top}.table th{font-size:12px;color:#64748b;white-space:nowrap}.table tr.clickable{cursor:pointer}.table tr.clickable:hover{background:#f8fafc}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;background:#e8eef8;color:#34506f}.badge.hot{background:#fee2e2;color:#991b1b}.badge.warm{background:#fef3c7;color:#92400e}.badge.cold{background:#e0f2fe;color:#075985}.badge.open{background:#fee2e2;color:#991b1b}.badge.reviewed{background:#fef3c7;color:#92400e}.badge.resolved{background:#dcfce7;color:#166534}.health{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:#16a34a}.dot.bad{background:#dc2626}.empty{padding:25px;text-align:center;color:#718096}.login{max-width:380px;margin:15vh auto}.login input{display:block;width:100%;padding:12px;border:1px solid #d6deea;border-radius:8px;margin:10px 0}.error{color:#b91c1c;font-size:13px;margin-top:10px}.modal{position:fixed;inset:0;background:#17203366;display:flex;align-items:center;justify-content:center;padding:20px;z-index:4}.modal-card{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:85vh;overflow:auto;padding:22px}.message{padding:10px 12px;border-radius:10px;background:#f1f5f9;margin:8px 0;white-space:pre-wrap}.message.visitor{background:#dbeafe}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.login .button{width:100%}@media(max-width:900px){.side{width:72px}.brand{font-size:0}.brand:after{content:'CO';font-size:19px}.nav{font-size:0}.nav:before{content:'•';font-size:22px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.main{padding:16px}}@media(max-width:500px){.grid{grid-template-columns:1fr}.top{display:block}.top .button{margin-top:12px}}
</style></head><body>
<div id="login" class="login card"><h1>Client Dashboard</h1><p class="muted">Use the client ID and password provided by ChatOS.</p><input id="client" placeholder="Client ID" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="button" onclick="login()">Sign in</button><div id="error" class="error"></div></div>
<div id="app" class="shell" style="display:none"><aside class="side"><div class="brand">ChatOS</div><button class="nav active" data-page="overview">Overview</button><button class="nav" data-page="leads">Leads</button><button class="nav" data-page="conversations">Conversations</button><button class="nav" data-page="questions">Questions &amp; Content Gaps</button><button class="nav" data-page="knowledge">Knowledge Base</button></aside><main class="main"><div class="top"><div><h1 id="title">Overview</h1><div class="muted">Business outcomes from your website assistant</div></div><button class="button secondary" onclick="logout()">Sign out</button></div><div id="content"></div></main></div><div id="modal" style="display:none"></div>
<script>
let token=sessionStorage.getItem('portalToken'), page='overview', preset='30d', leadSearchValue='', leadStatusValue='', leadScoreValue='', conversationSearchValue=''; const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function range(){let end=new Date(),start=new Date();if(preset==='today')start.setHours(0,0,0,0);if(preset==='7d')start.setDate(start.getDate()-7);if(preset==='30d')start.setDate(start.getDate()-30);if(preset==='custom'){start=new Date(($('from').value||new Date(Date.now()-30*864e5).toISOString().slice(0,10))+'T00:00:00Z');end=new Date(($('to').value||new Date().toISOString().slice(0,10))+'T23:59:59.999Z')}return 'date_from='+encodeURIComponent(start.toISOString())+'&date_to='+encodeURIComponent(end.toISOString())}
async function request(path,options={}){let r=await fetch('/api/portal'+path,{...options,headers:{Authorization:'Bearer '+token,...(options.headers||{})}});if(r.status===401){logout();throw Error('auth')}if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.detail||'Request failed')}return r.json()}
async function login(){let r=await fetch('/api/portal/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_id:$('client').value,password:$('password').value})});let d=await r.json();if(!r.ok){$('error').textContent=d.detail||'Invalid credentials';return}token=d.token;sessionStorage.setItem('portalToken',token);start()}
function logout(){sessionStorage.removeItem('portalToken');location.reload()}
function controls(){return '<div class="toolbar"><select id="preset" onchange="preset=this.value;render()"><option value="today">Today</option><option value="7d">Last 7 days</option><option value="30d" selected>Last 30 days</option><option value="custom">Custom range</option></select><input id="from" type="date" style="display:none"><input id="to" type="date" style="display:none"><button class="button secondary" onclick="render()">Refresh</button></div>'}
function setCustom(){if(preset==='custom'){['from','to'].forEach(id=>$(id).style.display='block')}else if($('from'))['from','to'].forEach(id=>$(id).style.display='none')}
function trend(v){if(v===null||v===undefined)return '<span class="muted">No comparison</span>';return '<span class="'+(v>=0?'up':'down')+'">'+(v>=0?'↑':'↓')+' '+Math.abs(v)+'%</span>'}
async function overview(){let d=await request('/dashboard?'+range());return controls()+'<div class="grid"><div class="card"><div class="label">Total Visitors</div><div class="metric">'+d.total_visitors+'</div><div class="trend">'+trend(d.trends.visitors_percent)+'</div></div><div class="card"><div class="label">Total Conversations</div><div class="metric">'+d.total_conversations+'</div><div class="trend">'+trend(d.trends.conversations_percent)+'</div></div><div class="card"><div class="label">Total Leads</div><div class="metric">'+d.total_leads+'</div><div class="trend">'+trend(d.trends.leads_percent)+'</div></div><div class="card"><div class="label">Lead Conversion</div><div class="metric">'+d.lead_conversion_percent+'%</div><div class="trend">Leads per conversation</div></div></div><div class="two"><div class="panel"><div class="panel-head"><h2>Recent leads</h2><button class="button secondary" onclick="go('leads')">View all</button></div>'+leadTable(d.recent_leads||[])+'</div><div class="panel"><h2>Knowledge base</h2>'+knowledgeCard(d.knowledge_base)+'</div></div><div class="panel"><h2>Top visitor topics</h2>'+((d.top_topics||[]).map(x=>'<p>'+esc(x.topic)+' <b>'+x.count+'</b></p>').join('')||'<div class="empty">Analytics will appear as visitors chat.</div>')+'</div>'}
function leadTable(items){if(!items.length)return '<div class="empty">No leads in this period.</div>';return '<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Name</th><th>Company</th><th>Score</th><th>Status</th><th>Summary</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc(x.created_at?.slice(0,10))+'</td><td>'+esc(x.name)+'<br><span class="muted">'+esc(x.email)+'</span></td><td>'+esc(x.company||'—')+'</td><td><span class="badge '+esc(x.lead_score_label)+'">'+esc(x.lead_score_label||'cold')+'</span></td><td><select onchange="updateLead(\''+x.id+'\',this.value)"><option value="">'+esc(x.status)+'</option><option value="new">new</option><option value="contacted">contacted</option><option value="qualified">qualified</option><option value="closed">closed</option><option value="lost">lost</option></select></td><td>'+esc(x.lead_summary)+'</td></tr>').join('')+'</tbody></table></div>'}
function knowledgeCard(k){if(!k)return '<div class="empty">Knowledge base status unavailable.</div>';let good=k.knowledge_status==='ready';return '<div class="health"><span class="dot '+(good?'':'bad')+'"></span><b>'+(good?'Healthy':esc(k.knowledge_status||'Unavailable'))+'</b></div><p class="muted">Last updated: '+esc((k.last_crawled_at||k.crawl_completed_at||'Not yet').slice(0,19).replace('T',' '))+'</p><p>Indexed pages: <b>'+esc(k.pages_crawled||0)+'</b></p><p>Failed pages: <b>'+esc(k.failed_pages||0)+'</b></p><p>Failed documents: <b>'+esc(k.failed_documents===null?'Not tracked':k.failed_documents)+'</b></p>'+(k.error_details?'<p class="error">'+esc(k.error_details)+'</p>':'')}
async function leads(){let d=await request('/leads?'+range()+'&search='+encodeURIComponent(leadSearchValue)+'&status='+encodeURIComponent(leadStatusValue)+'&score='+encodeURIComponent(leadScoreValue));return controls()+'<div class="panel"><div class="panel-head"><h2>Lead management</h2><button class="button" onclick="exportLeads()">Export CSV</button></div><div class="toolbar"><input id="leadSearch" value="'+esc(leadSearchValue)+'" placeholder="Search name, email, company" onkeydown="if(event.key===\'Enter\'){leadSearchValue=this.value;render()}"><select id="leadStatus" onchange="leadStatusValue=this.value;render()"><option value="">All statuses</option><option value="new" '+(leadStatusValue==='new'?'selected':'')+'>new</option><option value="contacted" '+(leadStatusValue==='contacted'?'selected':'')+'>contacted</option><option value="qualified" '+(leadStatusValue==='qualified'?'selected':'')+'>qualified</option><option value="closed" '+(leadStatusValue==='closed'?'selected':'')+'>closed</option><option value="lost" '+(leadStatusValue==='lost'?'selected':'')+'>lost</option></select><select id="leadScore" onchange="leadScoreValue=this.value;render()"><option value="">All scores</option><option value="hot" '+(leadScoreValue==='hot'?'selected':'')+'>hot</option><option value="warm" '+(leadScoreValue==='warm'?'selected':'')+'>warm</option><option value="cold" '+(leadScoreValue==='cold'?'selected':'')+'>cold</option></select></div>'+leadTable(d.items||[])+'</div>'}
async function conversations(){let d=await request('/conversations?'+range()+'&search='+encodeURIComponent(conversationSearchValue));let items=d.items||[];return controls()+'<div class="panel"><div class="panel-head"><h2>Conversations</h2><span class="muted">Transcripts are retained for 14 days</span></div><div class="toolbar"><input value="'+esc(conversationSearchValue)+'" placeholder="Search conversations" id="conversationSearch" onkeydown="if(event.key===\'Enter\'){conversationSearchValue=this.value;render()}"></div><div class="table-wrap"><table class="table"><thead><tr><th>Started</th><th>Conversation</th><th>Messages</th><th>Source page</th><th>Lead</th></tr></thead><tbody>'+(items.map(x=>'<tr class="clickable" onclick="showConversation(\''+encodeURIComponent(x.id)+'\')"><td>'+esc(x.started_at?.slice(0,19).replace('T',' '))+'</td><td>'+esc(x.id.slice(0,12))+'</td><td>'+esc(x.message_count)+'</td><td>'+esc(x.source_page_url||'—')+'</td><td>'+esc(x.lead_name||'—')+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No conversations found.</td></tr>')+'</tbody></table></div></div>'}
async function questions(){let [asked,unanswered]=await Promise.all([request('/questions/most-asked?'+range()),request('/questions/unanswered?'+range())]);return controls()+'<div class="panel"><h2>Most asked questions</h2><div class="table-wrap"><table class="table"><thead><tr><th>Question</th><th>Frequency</th><th>Last asked</th></tr></thead><tbody>'+(asked.items||[]).map(x=>'<tr><td>'+esc(x.representative_question)+'</td><td>'+x.question_count+'</td><td>'+esc(x.last_asked?.slice(0,10))+'</td></tr>').join('')||'<tr><td colspan="3" class="empty">No questions found.</td></tr>'+'</tbody></table></div></div><div class="panel"><h2>Unanswered questions</h2><div class="table-wrap"><table class="table"><thead><tr><th>Question</th><th>Frequency</th><th>Last asked</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(unanswered.items||[]).map(x=>'<tr><td>'+esc(x.question)+'</td><td>'+x.frequency+'</td><td>'+esc(x.last_seen_at?.slice(0,10))+'</td><td><span class="badge '+x.status+'">'+x.status+'</span></td><td><select onchange="updateQuestion(\''+x.id+'\',this.value)"><option value="">Update</option><option value="open">Open</option><option value="reviewed">In progress</option><option value="resolved">Resolved</option></select></td></tr>').join('')||'<tr><td colspan="5" class="empty">No unanswered questions found.</td></tr>'+'</tbody></table></div></div>'}
async function knowledge(){let d=await request('/dashboard?'+range());return '<div class="panel"><h2>Knowledge base status</h2>'+knowledgeCard(d.knowledge_base)+'</div><div class="panel"><p class="muted">The dashboard shows business-facing health only. Technical indexing details are intentionally hidden.</p></div>'}
async function render(){if($('preset'))preset=$('preset').value;setCustom();$('content').innerHTML='<div class="panel empty">Loading…</div>';try{$('content').innerHTML=page==='overview'?await overview():page==='leads'?await leads():page==='conversations'?await conversations():page==='questions'?await questions():await knowledge();setCustom()}catch(e){$('content').innerHTML='<div class="panel error">'+esc(e.message)+'</div>'}}
function go(next){page=next;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));$('title').textContent=page==='overview'?'Overview':page==='questions'?'Questions & Content Gaps':page[0].toUpperCase()+page.slice(1);render()}
async function showConversation(id){let d=await request('/conversations/'+id);$('modal').style.display='block';$('modal').innerHTML='<div class="modal"><div class="modal-card"><div class="panel-head"><h2>Conversation transcript</h2><button class="button secondary" onclick="$(\'modal\').style.display=\'none\'">Close</button></div><p class="muted">'+esc(d.conversation.started_at)+'</p>'+d.messages.map(m=>'<div class="message '+(m.role==='visitor'?'visitor':'')+'"><b>'+m.role+'</b><br>'+esc(m.content)+'</div>').join('')+'</div></div>'}
async function exportLeads(){let r=await fetch('/api/portal/leads.csv',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;let blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='leads.csv';a.click();URL.revokeObjectURL(url)}
async function updateLead(id,status){if(!status)return;await request('/leads/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});render()}
async function updateQuestion(id,status){if(!status)return;await request('/questions/unanswered/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});render()}
document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>go(x.dataset.page));if(token){$('login').style.display='none';$('app').style.display='flex';render()}
</script></body></html>
