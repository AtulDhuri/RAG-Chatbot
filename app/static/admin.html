<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin dashboard</title>
<style>
body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;padding:32px;color:#111827}
main{max-width:1000px;margin:auto}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 5px 20px #0001;margin-bottom:18px}
label{display:block;margin:10px 0}input,select,button{font:inherit;padding:9px 11px;border-radius:7px}input,select{border:1px solid #d1d5db;width:100%;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;cursor:pointer}.secondary{background:#6b7280}.error{color:#b91c1c}.success{color:#166534}.plan,.site{border-top:1px solid #e5e7eb;padding:14px 0}.site{display:grid;grid-template-columns:1.4fr 1.5fr 1fr 1fr auto;gap:10px;align-items:center}.muted{color:#6b7280;font-size:13px}@media(max-width:760px){.site{grid-template-columns:1fr}.site button{width:max-content}}
</style>
</head>
<body><main>
<section class="card"><h1>Admin dashboard</h1><button id="logout" class="secondary">Log out</button><p id="status" aria-live="polite"></p></section>
<section class="card"><h2>Create plan</h2><p>Create the Razorpay plan and save its ID automatically.</p>
<form id="form"><label>Plan ID<input name="id" placeholder="silver" pattern="[A-Za-z0-9_-]+" required></label><label>Name<input name="name" placeholder="Silver" required></label><label>Price<input name="price" type="number" min="0.01" step="0.01" required></label><label>Currency<input name="currency" value="INR" maxlength="3" required></label><label>Billing interval<select name="billing_interval"><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></label><label>Chat limit<input name="chat_limit" type="number" min="1" required></label><label>Website limit<input name="website_limit" type="number" min="1" value="1" required></label><label>Indexed page limit<input name="indexed_page_limit" type="number" min="1" value="100" required></label><button>Create plan</button></form>
</section>
<section class="card"><h2>Existing plans</h2><div id="plans">Loading...</div></section>
<section class="card"><h2>Registered websites</h2><div id="sites">Loading...</div></section>
</main>
<script>
(function(){
var form=document.getElementById('form'),status=document.getElementById('status');
function show(text,error){status.textContent=text||'';status.className=error?'error':'success';}
function request(path,options){options=options||{};options.credentials='same-origin';return fetch(path,options).then(function(r){return r.text().then(function(raw){var d=raw?JSON.parse(raw):{};if(!r.ok)throw new Error(d.detail||'Request failed');return d;});});}
function loadPlans(){return request('/api/plans').then(function(ps){var box=document.getElementById('plans');box.textContent='';if(!ps.length){box.textContent='No plans created yet.';return;}ps.forEach(function(p){var row=document.createElement('div');row.className='plan';row.textContent=p.name+' · '+p.id+' · '+(p.price_amount/100).toFixed(2)+' '+p.currency+' · '+p.chat_limit+' chats · Razorpay '+(p.razorpay_plan_id||'not created');box.appendChild(row);});});}
function loadSites(){return request('/api/admin/sites').then(function(sites){var box=document.getElementById('sites');box.textContent='';if(!sites.length){box.textContent='No websites registered yet.';return;}sites.forEach(function(site){var row=document.createElement('div');row.className='site';var info=document.createElement('div');info.textContent=site.domain;var customer=document.createElement('div');customer.textContent=site.customer_email;var plan=document.createElement('div');plan.textContent=site.plan;var state=document.createElement('div');state.textContent=site.subscription_status;var button=document.createElement('button');button.textContent='Recrawl';button.onclick=function(){button.disabled=true;button.textContent='Starting...';request('/api/admin/sites/'+encodeURIComponent(site.domain)+'/recrawl',{method:'POST'}).then(function(d){show('Recrawl '+d.status+' for '+d.domain);}).catch(function(e){show(e.message,true);}).finally(function(){button.disabled=false;button.textContent='Recrawl';});};row.appendChild(info);row.appendChild(customer);row.appendChild(plan);row.appendChild(state);row.appendChild(button);box.appendChild(row);});});}
form.onsubmit=function(e){e.preventDefault();var data=Object.fromEntries(new FormData(form));['price','chat_limit','website_limit','indexed_page_limit'].forEach(function(k){data[k]=Number(data[k]);});request('/api/admin/plans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(){show('Plan created.');form.reset();return loadPlans();}).catch(function(e){show(e.message,true);});};
document.getElementById('logout').onclick=function(){request('/api/auth/logout',{method:'POST'}).then(function(){location.href='/admin/login';});};
request('/api/admin/me').then(function(){return Promise.all([loadPlans(),loadSites()]);}).catch(function(){location.href='/admin/login';});
})();
</script>
</body></html>
