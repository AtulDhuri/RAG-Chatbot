<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan administration</title><style>body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;padding:32px;color:#111827}main{max-width:760px;margin:auto}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 5px 20px #0001;margin-bottom:18px}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:9px 11px;border-radius:7px}input,select{border:1px solid #d1d5db;width:100%;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;cursor:pointer}.error{color:#b91c1c}.plan{border-top:1px solid #e5e7eb;padding:12px 0}</style></head><body><main><section class="card"><h1>Manage plans</h1><p>Create the Razorpay plan and save its ID automatically. Enter the price in normal currency units, so ₹499 is entered as 499.</p><form id="form"><label>Plan ID<input name="id" placeholder="professional" pattern="[A-Za-z0-9_-]+" required></label><label>Name<input name="name" placeholder="Professional" required></label><label>Price<input name="price" type="number" min="0" step="0.01" required></label><label>Currency<input name="currency" value="INR" maxlength="3" required></label><label>Billing interval<select name="billing_interval"><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></label><label>Chat limit<input name="chat_limit" type="number" min="1" required></label><label>Website limit<input name="website_limit" type="number" min="1" value="1" required></label><label>Indexed page limit<input name="indexed_page_limit" type="number" min="1" value="100" required></label><button>Create plan</button></form><p id="status"></p></section><section class="card"><h2>Existing plans</h2><div id="plans">Loading...</div></section></main><script>(function(){var form=document.getElementById('form'),status=document.getElementById('status');function load(){fetch('/api/plans',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(ps){document.getElementById('plans').innerHTML=ps.map(function(p){return '<div class="plan"><b>'+p.name+'</b> · '+p.id+' · '+(p.price_amount/100).toFixed(2)+' '+p.currency+' · '+p.chat_limit+' chats · Razorpay '+(p.razorpay_plan_id||'not created')+'</div>';}).join('')||'No plans';});}form.onsubmit=function(e){e.preventDefault();var data=Object.fromEntries(new FormData(form));['chat_limit','website_limit','indexed_page_limit'].forEach(function(k){data[k]=Number(data[k]);});fetch('/api/admin/plans',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||'Request failed');return d;});}).then(function(){status.textContent='Plan created in Razorpay and saved.';form.reset();load();}).catch(function(e){status.textContent=e.message;status.className='error';});};fetch('/api/admin/me',{credentials:'same-origin'}).then(function(r){if(!r.ok)throw new Error();return r.json();}).then(load).catch(function(){location.href='/admin/login';});
})();</script></body></html>
