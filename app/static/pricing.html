<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plans</title><style>body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;padding:32px;color:#111827}main{max-width:1000px;margin:auto}h1{text-align:center}.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.plan{background:#fff;border-radius:14px;padding:22px;box-shadow:0 5px 20px #0001}.price{font-size:28px;font-weight:700}.plan button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}</style></head><body><main><h1>Choose your chatbot plan</h1><div class="plans" id="plans">Loading plans...</div></main><script>(function(){fetch('/api/plans').then(function(r){return r.json();}).then(function(plans){var box=document.getElementById('plans');box.textContent='';plans.forEach(function(p){var card=document.createElement('section');card.className='plan';var amount=(p.price_amount/100).toFixed(2);card.innerHTML='<h2></h2><div class="price"></div><p></p><p></p><p></p><button>Choose plan</button>';card.querySelector('h2').textContent=p.name;card.querySelector('.price').textContent=p.price_amount?'₹'+amount+' / '+p.billing_interval:'Contact us';card.querySelectorAll('p')[0].textContent=p.chat_limit+' chats per billing period';card.querySelectorAll('p')[1].textContent=p.website_limit+' website(s)';card.querySelectorAll('p')[2].textContent=p.indexed_page_limit+' indexed pages per website';card.querySelector('button').onclick=function(){window.location.assign('/login?plan_id='+encodeURIComponent(p.id));};box.appendChild(card);});}).catch(function(){document.getElementById('plans').textContent='Unable to load plans.';});})();</script></body></html>
