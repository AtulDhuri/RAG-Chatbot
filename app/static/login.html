<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer login</title><style>body{font-family:system-ui,sans-serif;background:#f3f4f6;padding:32px}.card{max-width:420px;margin:auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 5px 24px #0001}input,button{font:inherit;width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border-radius:8px}input{border:1px solid #d1d5db}button{border:0;background:#2563eb;color:#fff;cursor:pointer}.secondary{background:#6b7280}.error{color:#b91c1c;min-height:24px}</style></head><body><section class="card"><h1>Customer login</h1><p><a href="/pricing">View available plans</a></p><form id="login"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" minlength="10" required><button>Log in</button></form><p id="status" class="error" role="alert" aria-live="polite"></p><button class="secondary" id="register">Create account</button></section><script>(function(){function req(path,body){return fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||'Request failed');return d;});});}function afterLogin(){var plan=new URLSearchParams(location.search).get('plan_id');return fetch('/api/admin/me',{credentials:'same-origin'}).then(function(r){location.href=r.ok?'/admin':'/dashboard'+(plan?'?plan_id='+encodeURIComponent(plan):'');});}var e=document.getElementById('email'),p=document.getElementById('password'),s=document.getElementById('status'),plan=new URLSearchParams(location.search).get('plan_id')||'';document.getElementById('login').onsubmit=function(x){x.preventDefault();req('/api/auth/login',{email:e.value.trim(),password:p.value}).then(afterLogin).catch(function(x){s.textContent=x.message;});};document.getElementById('register').onclick=function(){req('/api/auth/register',{email:e.value.trim(),password:p.value,plan_id:plan}).then(afterLogin).catch(function(x){s.textContent=x.message;});};})();</script></body></html>
