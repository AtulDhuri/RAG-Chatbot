services:
  - type: web
    name: rag-chatbot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    # The container listens on $PORT, which Render injects automatically.
    envVars:
      # Set the actual value in the Render dashboard (kept secret, never in git).
      - key: OPENAI_API_KEY
        sync: false
    # Persist the ChromaDB vector store across deploys. Remove this block if you
    # are fine re-crawling on every deploy (ephemeral disk).
    disk:
      name: chroma-data
      mountPath: /app/data
      sizeGB: 1