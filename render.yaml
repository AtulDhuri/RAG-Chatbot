services:
  - type: web
    name: rag-chatbot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # The container listens on $PORT, which Render injects automatically.
    envVars:
      # Set the actual values in the Render dashboard (kept secret, never in git).
      - key: OPENAI_API_KEY
        sync: false
      - key: CONTEXT_DEV_API_KEY
        sync: false
      # ---- Vector store (Supabase Postgres + pgvector) ----
      # Durable, multi-tenant storage for chunks + embeddings. Because the index
      # lives in Supabase (not on the container disk), it survives deploys and
      # restarts and is safe across multiple replicas - no persistent disk needed.
      - key: VECTOR_BACKEND
        value: pgvector
      # Supabase connection string. Use the connection pooler URL (port 6543).
      - key: DATABASE_URL
        sync: false
      - key: EMBEDDING_DIM
        value: "1536"
